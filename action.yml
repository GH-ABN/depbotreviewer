name: Claude Dependabot Gate
description: >-
  A merge gate for Dependabot pull requests: builds and tests the merge result, has
  Claude check the upstream changes against your code and its test coverage, and
  gives a pass, needs-human or fail verdict.
author: Agility by Nature
branding:
  icon: shield
  color: orange

inputs:
  mode:
    description: >-
      `all` (default): one job builds, tests and reviews. `test` and `review` split that
      over two jobs so the PR's code never runs where a credential is: the `test` job runs
      test-command with no credentials and uploads the result; the `review` job, which
      needs the test job, gets the credentials, downloads the result and never runs the
      PR's code. Required for claude-code-oauth-token with a test-command. See README.
    required: false
    default: all
  test-artifact:
    description: Name of the artifact that carries the test result from the test job to the review job.
    required: false
    default: dependabot-gate-test
  anthropic-api-key:
    description: >-
      Anthropic API key. Dependabot-triggered workflows can only read Dependabot secrets,
      so store it under Settings > Secrets and variables > Dependabot. Set this or
      claude-code-oauth-token.
    required: false
    default: ""
  claude-code-oauth-token:
    description: >-
      Claude Code OAuth token (from `claude setup-token`), used instead of an API key.
      The review then runs through the Claude Code CLI with the same prompt, tools and
      verdict rules. Store it as a Dependabot secret too. Set this or anthropic-api-key.
    required: false
    default: ""
  web-fetch-domains:
    description: >-
      Claude Code engine only: comma-separated hosts that WebFetch may read, such as
      github.com. Any other URL is refused, so text planted in a changelog cannot have
      Claude send your code to another host. Empty uses the built-in list of source
      hosts and package registries (see README).
    required: false
    default: ""
  github-token:
    description: Token used to read the PR and post the comment and labels.
    required: false
    default: ${{ github.token }}
  model:
    description: Claude model ID.
    required: false
    default: claude-opus-5-5
  effort:
    description: "Claude effort level: low, medium, high, xhigh or max."
    required: false
    default: high
  max-turns:
    description: >-
      Maximum number of Claude turns (each turn can run several tools) before Claude
      is told to stop investigating and give its verdict.
    required: false
    default: "30"
  test-command:
    description: >-
      Shell command that builds and tests the PR (for example `npm ci && npm test`).
      It runs in the workspace, and Claude reads the result. Without it the verdict can
      never be a pass.
    required: false
    default: ""
  test-timeout-minutes:
    description: Timeout for test-command.
    required: false
    default: "20"
  post-comment:
    description: Post (or update) the review comment on the PR.
    required: false
    default: "true"
  add-labels:
    description: Add a verdict label to the PR, such as dependabot-review:pass.
    required: false
    default: "true"
  label-prefix:
    description: Prefix for verdict labels.
    required: false
    default: "dependabot-review:"
  fail-on:
    description: >-
      When the check fails. `fail` (default) fails only on a failing verdict, so people
      can still merge needs-human PRs after reading the review. `needs-human` fails on
      anything short of a pass. `never` always succeeds.
    required: false
    default: fail
  auto-merge:
    description: >-
      Merge without a human when the verdict is pass, Claude's confidence is high and
      the update type is in auto-merge-update-types. Uses GitHub auto-merge where branch
      protection allows it; otherwise waits for the PR's other checks and merges directly
      if they pass and nothing changed since the tests ran. Needs `contents: write`.
    required: false
    default: "false"
  auto-merge-method:
    description: "squash, merge or rebase."
    required: false
    default: squash
  auto-merge-update-types:
    description: >-
      Update types that may merge without a human, from Dependabot's own metadata:
      a comma-separated list of patch, minor and major. A grouped PR counts as its
      largest update.
    required: false
    default: patch,minor
  allowed-authors:
    description: >-
      Comma-separated PR authors to review. Other PRs are skipped. Add
      `renovate[bot]` to review Renovate PRs as well.
    required: false
    default: dependabot[bot]
  pr-number:
    description: PR number. Defaults to the PR in the triggering event (set it for workflow_dispatch).
    required: false
    default: ""
  ticket-on:
    description: >-
      Which verdicts add ready-to-paste ticket text (title and Markdown description for
      Linear, Jira or any tracker) to the PR comment: `fail` (default), `needs-human`
      (anything short of a pass) or `never`.
    required: false
    default: fail

outputs:
  verdict:
    description: "pass, needs-human or fail."
    value: ${{ steps.review.outputs.verdict }}
  risk:
    description: "Claude's risk rating: low, medium, high, or unknown (the review could not be completed)."
    value: ${{ steps.review.outputs.risk }}
  confidence:
    description: "Claude's confidence in the verdict: low, medium or high."
    value: ${{ steps.review.outputs.confidence }}
  skipped:
    description: "true when the PR was not by an allowed author."
    value: ${{ steps.review.outputs.skipped }}
  auto-merge:
    description: "true when the PR qualified for auto-merge."
    value: ${{ steps.review.outputs.auto-merge }}
  merged:
    description: "true when this run merged the PR itself (no branch protection to hand it to)."
    value: ${{ steps.review.outputs.merged }}

runs:
  using: composite
  steps:
    # Uses the runner's own python3 instead of actions/setup-python so the action
    # does not change the Python version seen by later steps in your job.
    - name: Install reviewer
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'EOF'
        import sys
        if sys.version_info < (3, 11):
            sys.exit(f"Claude Dependabot Reviewer needs Python 3.11+ on the runner, found {sys.version.split()[0]}")
        EOF
        python3 -m venv "$RUNNER_TEMP/dep-reviewer-venv"
        "$RUNNER_TEMP/dep-reviewer-venv/bin/pip" install --quiet --disable-pip-version-check \
          -r "$GITHUB_ACTION_PATH/requirements.txt"

    - name: Download the test result
      if: inputs.mode == 'review' && github.event_name != 'merge_group'
      # A missing result (the test job failed or was cancelled) is handled by the review:
      # no tests means no pass.
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.test-artifact }}
        path: ${{ runner.temp }}/dep-review-test-result

    - name: Install Claude Code
      id: claude-code
      if: inputs.claude-code-oauth-token != '' && inputs.mode != 'test'
      shell: bash
      # Installed from the action's own lockfile (claude-code/), which pins the CLI and its
      # platform packages by integrity hash, into a new directory outside the checkout:
      # npm reads .npmrc from its working directory, so running it in the reviewed repo
      # would let that repo pick the registry. User and global npm config are ignored too.
      env:
        npm_config_registry: https://registry.npmjs.org/
      run: |
        set -euo pipefail
        if ! command -v npm >/dev/null; then
          echo "::error::claude-code-oauth-token needs npm on the runner to install Claude Code (add actions/setup-node)."
          exit 1
        fi
        dir="$(mktemp -d "$RUNNER_TEMP/dep-reviewer-claude-code.XXXXXX")"
        cp "$GITHUB_ACTION_PATH/claude-code/package.json" "$GITHUB_ACTION_PATH/claude-code/package-lock.json" "$dir/"
        # Empty user and global config files (npm refuses the same file for both).
        : > "$dir/.user-npmrc"; : > "$dir/.global-npmrc"
        export npm_config_userconfig="$dir/.user-npmrc" npm_config_globalconfig="$dir/.global-npmrc"
        cd "$dir"
        npm ci --no-audit --no-fund --loglevel=error
        "$dir/node_modules/.bin/claude" --version
        echo "bin=$dir/node_modules/.bin/claude" >> "$GITHUB_OUTPUT"

    - name: Review with Claude
      id: review
      shell: bash
      env:
        INPUT_ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        INPUT_CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-code-oauth-token }}
        DEP_REVIEWER_CLAUDE_BIN: ${{ steps.claude-code.outputs.bin }}
        INPUT_WEB_FETCH_DOMAINS: ${{ inputs.web-fetch-domains }}
        # mode: test runs the PR's code, so it gets no token, except in a merge queue, which
        # needs one to look up the queued PR and only runs code that is about to land.
        INPUT_GITHUB_TOKEN: ${{ (inputs.mode != 'test' || github.event_name == 'merge_group') && inputs.github-token || '' }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_EFFORT: ${{ inputs.effort }}
        INPUT_MAX_TURNS: ${{ inputs.max-turns }}
        INPUT_TEST_COMMAND: ${{ inputs.test-command }}
        INPUT_TEST_TIMEOUT_MINUTES: ${{ inputs.test-timeout-minutes }}
        INPUT_POST_COMMENT: ${{ inputs.post-comment }}
        INPUT_ADD_LABELS: ${{ inputs.add-labels }}
        INPUT_LABEL_PREFIX: ${{ inputs.label-prefix }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_AUTO_MERGE: ${{ inputs.auto-merge }}
        INPUT_AUTO_MERGE_METHOD: ${{ inputs.auto-merge-method }}
        INPUT_AUTO_MERGE_UPDATE_TYPES: ${{ inputs.auto-merge-update-types }}
        INPUT_ALLOWED_AUTHORS: ${{ inputs.allowed-authors }}
        INPUT_PR_NUMBER: ${{ inputs.pr-number }}
        INPUT_TICKET_ON: ${{ inputs.ticket-on }}
      # -P stops Python from putting the working directory (the PR's code) on sys.path,
      # so a file in the reviewed repo cannot shadow one of the reviewer's imports.
      run: |
        PYTHONPATH="$GITHUB_ACTION_PATH/src" "$RUNNER_TEMP/dep-reviewer-venv/bin/python" -P -m dep_reviewer

    - name: Upload the test result
      if: always() && inputs.mode == 'test' && github.event_name != 'merge_group'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.test-artifact }}
        path: ${{ runner.temp }}/dep-review-test-result
        if-no-files-found: ignore
        retention-days: 1
