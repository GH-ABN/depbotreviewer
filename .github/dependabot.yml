version: 2
updates:
  # The testbed: deliberately old dependencies that exercise each verdict (see testbed/README.md).
  - package-ecosystem: npm
    directory: /testbed
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # The Claude Code CLI the Claude Code engine installs (claude-code/package-lock.json).
  - package-ecosystem: npm
    directory: /claude-code
    schedule:
      interval: weekly

  # The action's own Python dependencies: the gate reviews bumps to itself.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly

  # The workflows' own actions (checkout, setup-node, setup-python).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
