[project]
name = "dep-reviewer"
version = "0.1.0"
description = "Claude-powered impact review for Dependabot pull requests"
requires-python = ">=3.11"
dependencies = ["anthropic==2.7.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
